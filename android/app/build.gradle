        // For more information, see: https://flutter.dev/to/review-gradle-config.
        //minSdkVersion flutter.minSdkVersion//flutter.minSdkVersion
        minSdkVersion flutter.minSdkVersion
        targetSdk = 35//flutter.targetSdkVersion
        versionCode = 1513//flutter.versionCode
        versionName = 1513//flutter.versionName
    }

    signingConfigs {
        release {
            keyAlias 'upload'
            keyPassword 'Sj@2005@'
            storeFile file('/Users/renato/Documents/Developement/fouryoupet/upload-keystore.jks')
            storePassword 'Sj@2005@'
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
