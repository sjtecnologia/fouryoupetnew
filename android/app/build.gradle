plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

apply plugin: 'com.google.gms.google-services'


android {
    namespace = "com.sjtecnologia.fouryoupet"
    compileSdk = 36
    ndkVersion = "27.0.12077973"//ndkVersion = flutter.ndkVersion


    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_21
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.sjtecnologia.fouryoupet"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        //minSdkVersion flutter.minSdkVersion//flutter.minSdkVersion
        minSdkVersion flutter.minSdkVersion
        targetSdk = 36
        versionCode = 1517
        versionName = 1516//flutter.versionName
    }

    signingConfigs {
        release {
            if (project.hasProperty('flutter.keystorePath') &&
                    project.hasProperty('flutter.keystorePassword') &&
                    project.hasProperty('flutter.keyPassword') &&
                    project.hasProperty('flutter.keyAlias')) {
                keyAlias project.property('flutter.keyAlias')
                keyPassword project.property('flutter.keyPassword')
                storeFile file(project.property('flutter.keystorePath'))
                storePassword project.property('flutter.keystorePassword')
            } else {
                // Fallback: Try to load from key.properties
                def keystoreProperties = new Properties()
                def keystorePropertiesFile = rootProject.file('key.properties')
                if (keystorePropertiesFile.exists()) {
                    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
                    keyAlias keystoreProperties['keyAlias']
                    keyPassword keystoreProperties['keyPassword']
                    storeFile file(keystoreProperties['storeFile'])
                    storePassword keystoreProperties['storePassword']
                }
            }
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'androidx.multidex:multidex:2.0.1'
}

flutter {
    source = "../.."
}
