name: Marketplace checks

on:
  pull_request:
    paths:
      - "functions/**"
      - "lib/models/checkout_manager.dart"
      - "lib/models/cart/cart_manager.dart"
      - "lib/models/order/order.dart"
      - "lib/screens/checkout/**"
      - "lib/screens/edit_company/**"
      - "lib/services/mercado_pago_service.dart"
      - ".github/workflows/marketplace-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm test

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze changed Flutter files
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings lib/models/checkout_manager.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings lib/models/cart/cart_manager.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings lib/models/order/order.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings lib/screens/checkout/checkout_screen.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings lib/screens/product/product_screen.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings lib/screens/edit_company/edit_company_screen.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings lib/services/mercado_pago_service.dart
